[project]
name = "fuzzymatch"
version = "0.1.0"
description = "Pattern matching on meaning: dispatch to handlers by natural-language description, gated by calibrated confidence."
readme = "README.md"
license = "MIT"
authors = [{ name = "Sam Keen", email = "sam.sjk@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["typesafe-sdk>=0.7.2"]
keywords = ["pattern-matching", "dispatch", "classification", "typesafe", "jev", "llm"]

[project.urls]
Repository = "https://github.com/AlteredCraft/fuzzymatch"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.9"]

[tool.ruff]
line-length = 110

[tool.ruff.format]
exclude = ["*.md"]  # keep hand-aligned README snippets

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[package]
name = "fuzzymatch"
version = "0.1.0"
description = "Pattern matching on meaning: classify into your own enum by natural-language description, gated by calibrated confidence."
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Sam Keen <sam.sjk@gmail.com>"]
repository = "https://github.com/AlteredCraft/fuzzymatch"
readme = "README.md"
keywords = ["pattern-matching", "dispatch", "classification", "typesafe", "llm"]
categories = ["api-bindings", "text-processing"]

[features]
default = ["jev"]
# The TypeSafe Jev adapter. Turn it off to bring your own `Decider` without an HTTP client.
jev = ["dep:ureq", "dep:indexmap"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
indexmap = { version = "2", features = ["serde"], optional = true }
ureq = { version = "3", features = ["json"], optional = true }

[[example]]
name = "support_router"
required-features = ["jev"]
test = true

[[example]]
name = "shell_guard"
required-features = ["jev"]
test = true

[dev-dependencies]
ureq = { version = "3", features = ["json"] }
